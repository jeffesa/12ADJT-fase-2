name: Auto PR to Main

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-and-merge:
    name: Sync develop → main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verifica se há diferenças entre develop e main
          DIFF=$(git log origin/main..origin/develop --oneline 2>/dev/null)
          if [ -z "$DIFF" ]; then
            echo "✅ Nenhuma diferença entre develop e main. Nada a fazer."
            exit 0
          fi

          # Verifica se já existe PR aberto de develop para main
          EXISTING_PR=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number' 2>/dev/null)

          if [ -n "$EXISTING_PR" ]; then
            echo "✅ PR #$EXISTING_PR já existe. Habilitando auto-merge..."
            gh pr merge $EXISTING_PR --merge --auto 2>/dev/null || echo "Auto-merge já habilitado."
          else
            echo "📝 Criando PR develop → main com auto-merge..."
            PR_URL=$(gh pr create \
              --base main \
              --head develop \
              --title "release: sync develop → main" \
              --body "Automated PR to sync develop into main. All changes passed CI/CD and SonarCloud on develop.")
            
            PR_NUM=$(echo "$PR_URL" | grep -oP '\d+$')
            echo "✅ PR #$PR_NUM criado. Habilitando auto-merge..."
            gh pr merge $PR_NUM --merge --auto 2>/dev/null || echo "⚠️ Auto-merge não pôde ser habilitado."
          fi
